; ---------------------------------------------------------------------------
;  Desk Buddy - an EMO-style animated face for the ESP32-C3 Super Mini
;  https://docs.platformio.org/page/projectconf.html
; ---------------------------------------------------------------------------
; Plain `pio run` / `pio run -t upload` only touches the USB env. The OTA env
; below is opt-in with -e, so a USB flash never also tries to reach the
; buddy over the network.
[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform  = espressif32 @ ^6.9.0
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; The Super Mini exposes the C3's native USB (GPIO18/19), so Serial should be
; the USB CDC port, not UART0. Comment these two out if you talk to the board
; through a separate USB-serial adapter wired to GPIO20/21 instead.
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=0
	-O2
build_src_filter = +<*> -<wifitest/>

; Exact pins: a build should pull the same bytes next year as today.
lib_deps =
	adafruit/Adafruit SSD1306 @ 2.5.13
	adafruit/Adafruit GFX Library @ 1.11.11
	adafruit/Adafruit BusIO @ 1.16.1

; Over-the-air upload, once the buddy is on the network:
;   pio run -e esp32-c3-supermini-ota -t upload
; If you set DB_OTA_PASSWORD in secrets.h, uncomment upload_flags to match.
[env:esp32-c3-supermini-ota]
extends = env:esp32-c3-supermini
upload_protocol = espota
upload_port = deskbuddy.local
;upload_flags = --auth=your-ota-password

; A bare WiFi-only sketch with the ESP-IDF's WiFi logging at maximum, for
; when the buddy won't connect: pio run -e wifitest -t upload
[env:wifitest]
platform  = espressif32 @ ^6.9.0
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<wifitest/>
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=5

; The host preview harness (tools/host) is built with g++, not PlatformIO.
; See `make preview` in the Makefile.
